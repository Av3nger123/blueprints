verification:
  framework: node:test
  runtime: node>=20
  command: node verify/tests/run.mjs
  env:
    - name: BASE_URL
      required: true
      description: Origin of the running application under test, e.g. http://localhost:3000.
    - name: AUTH_PREFIX
      required: false
      default: /auth
      description: Path the auth contract endpoints are mounted under.
    - name: AUTH_MODE
      required: false
      default: session
      description: session (cookie sessions, the default) or token (access + rotating refresh tokens).
    - name: SESSION_COOKIE_NAME
      required: false
      description: Name of the session cookie; restricts cookie-flag checks to it.
    - name: CSRF_HEADER
      required: false
      default: X-CSRF-Token
      description: Header carrying the synchronizer token when GET /auth/csrf is implemented.
    - name: PROTECTED_PATH
      required: false
      description: A GET route requiring a permission the default user role lacks, e.g. /admin/ping.
    - name: ADMIN_EMAIL
      required: false
      description: Account that holds the permission PROTECTED_PATH requires.
    - name: ADMIN_PASSWORD
      required: false
      description: Password for ADMIN_EMAIL.
    - name: RATE_LIMIT_MAX_ATTEMPTS
      required: false
      default: "10"
      description: Failed logins within which a 429 must appear.
    - name: TEST_EMAIL_DOMAIN
      required: false
      default: example.com
      description: Domain used for generated test accounts.
last_reviewed: "2026-11-26"
license: CC-BY-4.0
tags: [authentication, authorization, login, signup, sessions, passwords, password-reset, rbac, csrf, owasp-asvs]
