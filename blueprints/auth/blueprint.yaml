title: Authentication & Authorization
summary: >-
  Email-and-password authentication with server-side sessions, argon2id password storage, recovery,
  brute-force and CSRF protection, and deny-by-default RBAC enforced in the service layer.
category: security
status: draft
authors:
  - name: Av3nger123
    github: Av3nger123
reviewers: []
stacks: [express, fastapi, nextjs]
depends_on: []
